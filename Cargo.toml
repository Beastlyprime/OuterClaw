[package]
name = "outerclaw"
version = "0.1.1"
edition = "2021"
description = "External watchdog & data protection for OpenClaw"
license = "AGPL-3.0"
default-run = "outerclaw"

[[bin]]
name = "outerclaw"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["signal", "fs", "ioctl", "process", "socket", "user"] }
notify = "7"
sha2 = "0.10"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
dialoguer = "0.11"
clap_complete = "4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
